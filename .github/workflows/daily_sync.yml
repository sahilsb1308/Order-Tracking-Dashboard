name: Daily Order Sync

on:
  schedule:
    - cron: "30 2 * * *"   # 8:00 AM IST (UTC+5:30 = 02:30 UTC)
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          CLICKPOST_KEY:               ${{ secrets.CLICKPOST_KEY }}
          CLICKPOST_USERNAME:          ${{ secrets.CLICKPOST_USERNAME }}
          SHOPIFY_STORE:               ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN:               ${{ secrets.SHOPIFY_TOKEN }}
          SHEET_ID:                    ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EASYECOM_API_KEY:            ${{ secrets.EASYECOM_API_KEY }}
          EASYECOM_EMAIL:              ${{ secrets.EASYECOM_EMAIL }}
          EASYECOM_PASSWORD:           ${{ secrets.EASYECOM_PASSWORD }}
          EASYECOM_LOCATION_KEY:       ${{ secrets.EASYECOM_LOCATION_KEY }}
        run: python sync_clickpost.py
